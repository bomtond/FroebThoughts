<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic 8-Ball Quote Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: linear-gradient(45deg, #ff00cc, #3333ff, #ffff33, #00ffcc, #ff6600);
      background-size: 400% 400%;
      animation: gradientAnimation 10s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      background-color: #000000aa;
      color: white;
      border: 2px solid white;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    button:hover {
      background-color: #ffffff33;
      transform: scale(1.1);
    }

    img {
      max-width: 75%; /* Reduce size by approximately 25% */
      height: auto;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <img src="shamanfroeb.png" alt="Shaman Froeb">
  <h1>Froeb GPT</h1>
  <p>Powered By FroebThoughts</p>
  <button id="playButton">Recieve Wisdom</button>
  <audio id="audioPlayer"></audio>

  <script>
    // Predefined list of MP3 files
    const mp3Files = [
      "Quotes/quote1.mp3",
      "Quotes/quote2.mp3",
      "Quotes/quote3.mp3"
    ];

    // Function to play a random MP3
    document.getElementById('playButton').addEventListener('click', () => {
      const randomIndex = Math.floor(Math.random() * mp3Files.length);
      const audioPlayer = document.getElementById('audioPlayer');
      audioPlayer.src = mp3Files[randomIndex];
      audioPlayer.play();
    });
  </script>
</body>
</html>
